<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="app/gerente-192.png">
<style>:root{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
#carga{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;text-align:center;background:var(--bg);color:var(--ink-2);font:16px/1.5 system-ui,sans-serif}
#carga a,#carga button{display:inline-block;margin-top:14px;padding:10px 16px;border-radius:9px;border:1px solid var(--y26);background:none;color:var(--y26);font:inherit;font-weight:600;text-decoration:none;cursor:pointer}</style>
</head>
<body>
<title>Painel Executivo Pollo Decor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho fixo com filtros que valem para tudo; abas por pergunta de negócio; resumo antes do detalhe. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#EDF0EE; --ink:#15201C; --ink-2:#53605B; --ink-3:#7E8A85; --line:#DCE2DF; --line-2:#EAEEEC;
  --y26:#008573; --y25:#C07A2C; --fat:#4A72C4; --y26-soft:#DDF0EC; --band:#EEF4F2; --track:#E7ECEA;
  --good:#1B7A4B; --good-bg:#E1F2E8; --bad:#B3392F; --bad-bg:#F8E4E1; --warn:#8C5E0A; --warn-bg:#F8EED5; --neutral-bg:#EBEFED;
  --f-disp:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(21,32,28,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1413; --surface:#171D1B; --surface-2:#1E2523; --ink:#E7EDEA; --ink-2:#A7B2AD; --ink-3:#7F8A86; --line:#2B3431; --line-2:#222A28;
  --y26:#12A38D; --y25:#C58545; --fat:#5B8BD6; --y26-soft:#143630; --band:#1B2422; --track:#252E2B;
  --good:#6FCB97; --good-bg:#173224; --bad:#EE9087; --bad-bg:#3C211E; --warn:#E3B860; --warn-bg:#3A2E14; --neutral-bg:#232B29;
  --shadow:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1413; --surface:#171D1B; --surface-2:#1E2523; --ink:#E7EDEA; --ink-2:#A7B2AD; --ink-3:#7F8A86; --line:#2B3431; --line-2:#222A28;
  --y26:#12A38D; --y25:#C58545; --fat:#5B8BD6; --y26-soft:#143630; --band:#1B2422; --track:#252E2B;
  --good:#6FCB97; --good-bg:#173224; --bad:#EE9087; --bad-bg:#3C211E; --warn:#E3B860; --warn-bg:#3A2E14; --neutral-bg:#232B29;
  --shadow:none; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
.num{font-variant-numeric:tabular-nums}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--y26);outline-offset:2px}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;padding-block:18px 12px}
.brand{font:600 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
h1{margin:6px 0 0;font:700 clamp(24px,3.4vw,32px)/1.05 var(--f-disp);letter-spacing:-.01em}
.asof{font-size:13px;color:var(--ink-2);text-align:right}
.asof b{color:var(--ink);font-weight:600}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:0 12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.sel{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:0 4px 0 12px;min-width:0}
.sel label{font-size:12px;color:var(--ink-3);white-space:nowrap}
.sel select{border:0;background:transparent;padding:8px 4px;max-width:160px;min-width:0;cursor:pointer}
.limpar{border:0;background:none;color:var(--y26);font-weight:600;cursor:pointer;padding:8px 6px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;font:600 15px var(--f-disp);color:var(--ink-3);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--y26)}

/* conteúdo */
main{padding-block:22px 56px;display:grid;gap:18px}
.scope{font-size:13px;color:var(--ink-2)}
.scope b{color:var(--ink);font-weight:600}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0;box-shadow:var(--shadow)}
.card h2{margin:0;font:600 17px/1.2 var(--f-disp)}
.card .sub{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.card-h{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 16px;margin-bottom:16px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.kpi{padding:18px 20px;border-left:1px solid var(--line-2);min-width:0}
.kpi:first-child{border-left:0}
.kpi .l{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{margin-top:8px;font:700 clamp(24px,2.7vw,32px)/1 var(--f-disp);letter-spacing:-.01em;white-space:nowrap}
.kpi .c{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13px;color:var(--ink-2)}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--neutral-bg);color:var(--ink-2)}
.pill.up{background:var(--good-bg);color:var(--good)} .pill.down{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend i.box{height:10px;width:10px;border-radius:3px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:12px var(--f-body);fill:var(--ink-3);font-variant-numeric:tabular-nums}
.chart .endl{font-weight:600;fill:var(--ink)}

/* meta */
.meta-v{font:700 40px/1 var(--f-disp);letter-spacing:-.02em}
.meta-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.prog{position:relative;height:14px;border-radius:7px;background:var(--track);margin:16px 0 8px}
.prog>span{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--y26);min-width:4px}
.prog>em{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink-2);border-radius:1px}
.prog-l{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line-2)}
.fact .l{font-size:12px;color:var(--ink-3)} .fact .v{font-weight:600;font-size:16px;margin-top:2px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:6px 0 10px}
.stack span{min-width:3px}

/* leituras */
.reads{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.reads li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.reads .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--neutral-bg);color:var(--ink-2)}
.reads .ic.up{background:var(--good-bg);color:var(--good)} .reads .ic.down{background:var(--bad-bg);color:var(--bad)} .reads .ic.warn{background:var(--warn-bg);color:var(--warn)}
.reads b{font-weight:600}

/* listas com barras */
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(120px,1.15fr) minmax(90px,1.5fr) 92px 84px;gap:6px 14px;align-items:center;padding:9px 6px;border-top:1px solid var(--line-2);border-radius:6px}
.row:first-child{border-top:0}
.row:hover{background:var(--band)}
.row.h{padding-block:0 8px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.row.h:hover{background:none}
.row .n{min-width:0}
.row .n .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n .s{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{text-align:right;font-weight:600;white-space:nowrap}
.row .d{text-align:right}
.bars{display:grid;gap:3px}
.bars span{display:block;height:10px;border-radius:0 4px 4px 0;background:var(--y26);min-width:2px}
.bars span.p{height:4px;background:var(--y25);border-radius:0 2px 2px 0}
.bars span.z{background:transparent}
.bars span.f{background:var(--fat)}
.row.rm{grid-template-columns:minmax(120px,1.15fr) minmax(80px,1.4fr) 104px 104px}
.row.rm .d{font-weight:600;white-space:nowrap}
.row.tot{border-top:2px solid var(--line);font-weight:600}
.row.tot:hover{background:none}
.rank{display:inline-block;width:22px;color:var(--ink-3);font-size:12px}
.more{margin-top:12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer}
.note{margin:12px 0 0;font-size:12.5px;color:var(--ink-3)}
.mrow{grid-template-columns:minmax(120px,1.1fr) minmax(90px,1.5fr) 150px 64px}
.mbar{position:relative;height:10px;border-radius:5px;background:var(--track)}
.mbar span{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--y26)}
.mbar span.ok{background:var(--good)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.stat .l{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font:700 28px/1 var(--f-disp);margin-top:8px}
.stat .c{font-size:13px;color:var(--ink-2);margin-top:8px}

#tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.22);max-width:260px}
#tip .tt{font-weight:600;margin-bottom:3px}
#tip .tr{display:flex;justify-content:space-between;gap:16px}
#tip .tr i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
#tip .tr b{font-weight:600;font-variant-numeric:tabular-nums}
footer{font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-block:16px 8px;line-height:1.6}

.busca{position:relative;flex:1 1 220px;max-width:340px}
.busca input{border:0;background:transparent;padding:8px 4px;width:100%;min-width:0;font:inherit;color:inherit;outline:none}
#sug{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:6px;max-height:60vh;overflow:auto}
#sug .g{padding:6px 8px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
#sug button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:7px;cursor:pointer}
#sug button:hover,#sug button:focus-visible{background:var(--band)}
#sug small{display:block;color:var(--ink-3);font-size:12px}
#det{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(8,14,12,.5)}
#det .pan{width:min(820px,100%);height:100%;overflow:auto;background:var(--bg);padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start;box-shadow:-10px 0 40px rgba(0,0,0,.25)}
.det-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.det-h .k{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--y26)}
.det-h h2{margin:4px 0 2px;font:700 24px/1.15 var(--f-disp);text-wrap:balance}
.det-h p{margin:0;font-size:13px;color:var(--ink-2)}
.fechar{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-weight:600;cursor:pointer}
.tbw{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:0 10px 8px 0;white-space:nowrap}
.tb td{padding:8px 10px 8px 0;border-top:1px solid var(--line-2);vertical-align:top}
.tb .r{text-align:right;white-space:nowrap} .tb th.r{padding-right:0} .tb td.r:last-child{padding-right:0;font-weight:600}
.tb .dt{white-space:nowrap;font-weight:600} .tb .mut{color:var(--ink-3);font-size:12px}
.tb tr.novo td{border-top:1px solid var(--line)}
.lk{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.lk:hover{text-decoration-color:var(--y26);color:var(--y26)}
.asof .atu{display:inline-block;margin-top:6px;border:1px solid var(--y26);background:transparent;color:var(--y26);border-radius:8px;padding:5px 10px;font-weight:600;font-size:12.5px;cursor:pointer}
.passos{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--ink-2)}
.arq{display:block;width:100%;margin-top:14px;padding:14px;border:1.5px dashed var(--line);border-radius:10px;background:var(--surface-2);font:inherit;color:inherit}
.acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btp{border:0;background:var(--y26);color:#fff;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer}
.btp[disabled]{opacity:.55;cursor:default}
.aviso{margin:14px 0 0;padding:10px 12px;border-radius:9px;background:var(--warn-bg);color:var(--warn);font-size:13.5px}
.aviso.ok{background:var(--good-bg);color:var(--good)} .aviso.erro{background:var(--bad-bg);color:var(--bad)}
.selo{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-right:8px;background:var(--y26-soft);color:var(--y26)}
.selo.fat{background:color-mix(in srgb,var(--fat) 16%,transparent);color:var(--fat)}
#modo button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px;font-size:13.5px}
.dl b{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.dl .larga{grid-column:1/-1}
.tb tr.cg{cursor:pointer} .tb tr.cg:hover td{background:var(--band)} .tb tr.sub td{background:var(--surface-2);font-size:13px}
.kpi.kbtn{cursor:pointer;text-align:left;background:none;border:0;border-left:1px solid var(--line-2);font:inherit;color:inherit;display:block;width:100%}
.kpi.kbtn:first-child{border-left:0}
.kpi.kbtn[aria-pressed="true"]{background:var(--band);box-shadow:inset 0 -3px 0 var(--ink)}
.kpi.kbtn:hover{background:var(--band)}
.ponto{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.emp{display:flex;height:16px;gap:2px;border-radius:4px;overflow:hidden}
.emp button{border:0;padding:0;min-width:3px;cursor:pointer}
.emp button:hover{filter:brightness(1.12)}
.row.re{grid-template-columns:minmax(120px,1fr) minmax(120px,2.2fr) 70px}
.tb td.hoje,.tb th.hoje{background:var(--band)}
.tb tr.on td{background:var(--y26-soft)}
.tb tr.sem td{background:var(--band);border-top:2px solid var(--line);padding-top:10px;padding-bottom:10px}
.tb tfoot td{border-top:2px solid var(--line);font-weight:600}
.vazioP{padding:36px 20px;text-align:center;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--y26-soft);color:var(--ink);font-size:12.5px;font-weight:600;border:0;cursor:pointer}
.chip span{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface);font-size:12px;line-height:1}
.row.pick{cursor:pointer}
.row.on{background:var(--y26-soft)}
.ord{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px;font-size:12.5px;color:var(--ink-3)}
.ord .seg button{padding:5px 10px;font-size:12.5px}
.hint{font-size:12.5px;color:var(--ink-3);margin:10px 0 0}
.chart svg{cursor:pointer}
@media (max-width:900px){ .g2,.g2e{grid-template-columns:minmax(0,1fr)} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .kpi:nth-child(3){border-left:0} .kpi:nth-child(n+3){border-top:1px solid var(--line-2)} .trio{grid-template-columns:minmax(0,1fr)} }
@media (max-width:620px){
  .wrap{padding-inline:16px} .card{padding:16px} .asof{text-align:left}
  .top{position:static} .busca{max-width:none;flex-basis:100%} #det .pan{padding-inline:16px}
  .row{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"n val d" "b b b"} .row .n{grid-area:n} .row .bars,.row .mbar{grid-area:b} .row .val{grid-area:val} .row .d{grid-area:d}
  .row.h{display:none} .sel{flex:1 1 150px} .sel select{max-width:none;flex:1} #periodo{width:100%} #periodo button{flex:1;padding-inline:6px}
  .meta-v{font-size:34px}
}
@media (prefers-reduced-motion:no-preference){ .bars span,.prog>span,.mbar span{transition:width .35s ease} }
</style>

<div class="top">
  <div class="wrap">
    <div class="head">
      <div><div class="brand"><a href="gerente.html" style="color:var(--y26);text-decoration:none;font-weight:700">← Voltar ao módulo gerente</a> &nbsp;·&nbsp; Pollo Decor · Comercial</div><h1>Painel Executivo</h1></div>
      <div class="asof" id="asof"></div>
    </div>
    <div class="filters">
      <div class="seg" id="modo" role="group" aria-label="Visão"><button type="button" data-m="ven">Vendas</button><button type="button" data-m="fat">Faturamento</button></div>
      <div class="seg" id="periodo" role="group" aria-label="Período">
      </div>
      <div class="sel"><label for="fDe">De</label><select id="fDe"></select><label for="fAte">até</label><select id="fAte"></select></div>
      <div class="sel"><label for="fRep">Representante</label><select id="fRep"></select></div>
      <div class="sel"><label for="fUf">Estado</label><select id="fUf"></select></div>
      <div class="sel"><label for="fCat">Categoria</label><select id="fCat"></select></div>
      <div class="sel busca"><label for="q">Buscar</label><input id="q" type="search" placeholder="cliente ou produto" autocomplete="off" spellcheck="false"><div id="sug" hidden></div></div>
      <button type="button" class="limpar" id="limpar" hidden>Limpar filtros</button>
