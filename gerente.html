<style>
:root{
  --bg:#F2F3F0; --surface:#FFFFFF; --surface-2:#E9EBE6; --muted:#EDEFEB;
  --ink:#1C2220; --ink-2:#525C57; --ink-3:#7F8883; --line:#D8DBD4; --line-2:#E8EAE5;
  --accent:#8F5329; --accent-ink:#FFFFFF; --accent-soft:#F6EBE1;
  --ok:#2A7148; --ok-bg:#E2F0E7; --warn:#8A5E0F; --warn-bg:#F7EDD6; --crit:#A3372F; --crit-bg:#F7E2DE;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121615; --surface:#1A1F1E; --surface-2:#232928; --muted:#1E2423;
  --ink:#E7EAE6; --ink-2:#A8B0AB; --ink-3:#838C88; --line:#333A37; --line-2:#272E2C;
  --accent:#D38D5C; --accent-ink:#1B120D; --accent-soft:#33241B;
  --ok:#74C495; --ok-bg:#1C3326; --warn:#E2B55E; --warn-bg:#3A2F16; --crit:#EA8F85; --crit-bg:#3E2320;
}}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body)}
input,select,textarea{font-size:16px;font-family:inherit;color:inherit}
button{font:inherit;color:inherit;touch-action:manipulation;user-select:none;-webkit-user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.topo{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.cabeca{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;max-width:1100px;margin:0 auto}
.marca{font:700 10px/1 var(--f-disp);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font:700 20px/1.05 var(--f-disp);margin:3px 0 0}
.diaTxt{font-size:11.5px;color:var(--ink-3);text-align:right;line-height:1.35;padding-top:3px}
.abas{display:flex;gap:0;padding:0 14px;max-width:1100px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas button{flex:none;padding:10px 12px;border:0;border-bottom:3px solid transparent;background:none;font:600 14px var(--f-disp);color:var(--ink-3);white-space:nowrap}
.abas button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.abas a{flex:none;padding:10px 12px;border-bottom:3px solid transparent;font:600 14px var(--f-disp);color:var(--accent);white-space:nowrap;text-decoration:none}
.abas a.painel{color:var(--ink-3)}
.abas a.ext{margin-left:auto}
.abas button b{font-family:var(--f-mono);font-size:12px;margin-left:5px;color:var(--ink-3)}

.placar{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
@media (min-width:600px){.placar{grid-template-columns:repeat(4,1fr)}}
.placar div{background:var(--surface);padding:9px 14px}
.placar .rot{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.placar .val{font:600 22px/1.15 var(--f-mono)}
.placar .val.pend{color:var(--accent)} .placar .val.ped{color:var(--ok)}
.placar .un{font-size:10.5px;color:var(--ink-3)}

.ferramentas{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;max-width:1100px;margin:0 auto}
.ferramentas input[type=search]{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--muted)}
.ferramentas input[type=date]{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--muted)}
.bt{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:13.5px;color:var(--ink-2);transition:background 120ms ease-out}
.bt:active{background:var(--line);transform:scale(.98)}
.bt.forte{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bt.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;max-width:1100px;margin:0 auto;scrollbar-width:none;touch-action:pan-x}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:500 13px var(--f-body);color:var(--ink-2);white-space:nowrap}
.chip b{font-family:var(--f-mono);font-weight:600;margin-left:6px;color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:var(--bg);opacity:.72}

main{max-width:1100px;margin:0 auto;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 40px)}
.pessoa{margin:0 0 10px;background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pessoaTopo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;background:var(--surface-2)}
.pessoaNome{font:700 15px/1.2 var(--f-disp);letter-spacing:.02em}
.pessoaSub{font-size:11.5px;color:var(--ink-3)}
.pessoaNum{text-align:right;font:600 13px var(--f-mono);white-space:nowrap}
.pessoaNum .pend{color:var(--accent)}
.res{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.res:last-child{border-bottom:0}
.res.feito{background:var(--ok-bg)}
.resNome{font:600 14.5px/1.25 var(--f-body)}
.resSub{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;font-size:12px;color:var(--ink-2);margin-top:3px}
.etq{font:600 10px/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:4px}
.etq.linha{background:var(--ok-bg);color:var(--ok)}
.etq.fora{background:var(--surface-2);color:var(--ink-3)}
.etq.lum{background:var(--warn-bg);color:var(--warn)}
.direita{display:flex;align-items:center;gap:10px}
.qtd{text-align:right;min-width:44px}
.qtd b{display:block;font:600 20px/1 var(--f-mono)}
.qtd small{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em}
.vazio{padding:40px 20px;text-align:center;color:var(--ink-3)}
.cad{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:10px}
.cad input{flex:1;min-width:140px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--muted)}
.rep{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.rep.bloq{opacity:.62}
.repLink{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.repLink code{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);overflow-wrap:anywhere;flex:1;min-width:120px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:30;
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:999px;font-size:13.5px;max-width:92vw;text-align:center}
.entrar{max-width:420px;margin:48px auto;padding:0 18px;display:grid;gap:12px}
.entrar input{padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.entrar button{padding:14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 16px var(--f-disp)}
[hidden]{display:none!important}
.ferramentas select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--muted);max-width:100%}
.ferramentas label{font-size:12px;color:var(--ink-3)}
.secao{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 14px 7px;font:700 12px/1.2 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.secao span{font:400 11.5px var(--f-body);letter-spacing:0;text-transform:none}
.uso{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:11px 14px;background:var(--surface);border-bottom:1px solid var(--line-2);width:100%;border-left:0;border-right:0;border-top:0;text-align:left}
.uso[aria-pressed="true"]{background:var(--accent-soft)}
.usoQuando{text-align:right;font:600 13px/1.25 var(--f-mono);white-space:nowrap}
.usoQuando small{display:block;font:400 11.5px var(--f-body);color:var(--ink-3)}
.etq.crit{background:var(--crit-bg);color:var(--crit)}
.diaTit{padding:12px 14px 6px;font:600 12.5px var(--f-mono);color:var(--ink-2);background:var(--bg)}
.ev{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.ev time{font:600 12.5px/1.5 var(--f-mono);color:var(--ink-2)}
.evQuem{font:600 14px/1.3 var(--f-body)}
.evQue{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;font-size:12.5px;color:var(--ink-2);margin-top:3px}
.cli{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 14px;background:var(--surface);border:0;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.cli[aria-expanded="true"]{background:var(--accent-soft)}
.cliDir{text-align:right;font-size:12px;color:var(--ink-3);white-space:nowrap}
.ficha{background:var(--surface);border-bottom:1px solid var(--line);padding:4px 14px 16px;display:grid;gap:14px}
.fichaDados{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;font-size:13px}
.fichaDados div b{display:block;font:600 10.5px var(--f-disp);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.campo{display:grid;gap:5px}
.campo label{font:600 11px var(--f-disp);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.campo input,.campo select,.campo textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--muted);width:100%}
.campo textarea{min-height:76px;resize:vertical;line-height:1.4}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.acessoRep{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.acessoRep .campo{flex:1;min-width:130px}
.nota{padding:10px 14px;font-size:12.5px;color:var(--ink-2);background:var(--warn-bg)}
.rodapeAud{padding:14px;font-size:12px;color:var(--ink-3);line-height:1.5}
@media (hover:hover) and (pointer:fine){
  .uso:hover{background:var(--muted)}
  .bt:hover{border-color:var(--accent)}
  .chip:hover{border-color:var(--accent)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL = "https://qatazfwvckitolhqsqtl.supabase.co";
const SUPA_KEY = "sb_publishable_Mq2CWYw_E4T13_rIYgH83Q_678o_prh";
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
const $ = (s) => document.querySelector(s);
const el = (t, a, ...k) => { const e = document.createElement(t);
  if (a) for (const [n, v] of Object.entries(a)) { if (v == null || v === false) continue;
    if (n === "class") e.className = v; else if (n.startsWith("on")) e.addEventListener(n.slice(2), v); else e.setAttribute(n, v === true ? "" : v); }
  for (const c of k.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e; };
const fmt = (n) => (Number(n) || 0).toLocaleString("pt-BR");
const titulo = (s) => String(s || "").toLowerCase()
  .replace(/(^|[\s\/(\-])([a-z\u00e0-\u00fa])/g, (m, a, b) => a + b.toUpperCase())
  .replace(/\bLc\b/g, "LC").replace(/\bTv\b/g, "TV");
const semAcento = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const hora = (t) => new Date(t).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const dataBR = (d) => { const p = String(d || "").split("-"); return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : String(d || ""); };
const LINK_APP = location.origin + location.pathname.replace(/gerente(\.html)?$/, "");

let cli = { d: null, lista: [], busca: "", consultor: "", aberto: null, imp: null, foco: false, t: null };
let aud = null, audF = { de: "", ate: "", usuario: "", acao: "" };
let token = null, aba = "reservas", filtro = "pendentes", busca = "", reservas = null, reps = null, dia = null, montado = false, ocupado = false;
try { token = new URLSearchParams(location.hash.slice(1)).get("t") || localStorage.getItem("pe-gerente"); } catch (e) {}
if (token && location.hash.indexOf("t=") >= 0) { try { localStorage.setItem("pe-gerente", token); } catch (e) {} history.replaceState(null, "", location.pathname); }
const chamar = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; };
function toast(t) { const d = el("div", { class: "toast" }, t); document.body.append(d); setTimeout(() => d.remove(), 2600); }

async function carregar() {
  try {
    const r = await chamar("api_reservas", { p_token: token, p_dia: dia });
    if (r && r.erro) { montado = false; return telaEntrar("Este código não é de gerênte."); }
    reservas = r;
    reps = await chamar("api_representantes", { p_token: token });
    if (aba === "aud" || !aud) await carregarAud(true);
    if (!cli.d) await carregarCli();
  } catch (e) { toast("Sem conexão com o servidor."); if (!montado) return telaEntrar("Não consegui falar com o servidor. Tente de novo."); }
  if (!montado) montarTela(); else render();
}
async function carregarAud(quieto) {
  try {
    const r = await chamar("api_auditoria", { p_token: token, p_de: audF.de || null, p_ate: audF.ate || null,
      p_usuario: audF.usuario ? Number(audF.usuario) : null, p_acao: audF.acao || null });
    if (r && !r.erro) aud = r;
  } catch (e) { if (!quieto) toast("Não consegui carregar a auditoria."); }
  if (!quieto && montado) render();
}
async function carregarCli(mais) {
  try {
    const r = await chamar("api_clientes", { p_token: token, p_busca: cli.busca || null, p_consultor: cli.consultor ? Number(cli.consultor) : null,
      p_limite: 50, p_pulo: mais ? cli.lista.length : 0 });
    if (r && !r.erro) { cli.d = r; cli.lista = mais ? cli.lista.concat(r.clientes || []) : (r.clientes || []); }
  } catch (e) { toast("Não consegui carregar os clientes."); }
  if (montado && aba === "cli") render();
}
function lerClientes(txt) {
  const ROT = [["CPF/CNPJ:", "doc"], ["R.G./I.E.:", "ie"], ["Endereço:", "endereco"], ["Bairro:", "bairro"], ["Cidade:", "cidade"], ["UF:", "uf"], ["CEP:", "cep"],
    ["Contato:", "contato"], ["Região:", "regiao"], ["Status:", "status"], ["Telefone:", "telefone"]];
  const mapa = new Map(); let cons = null, cur = null, emissao = "";
  for (const raw of txt.split(/\r?\n/)) {
    const f = raw.split(";").map((x) => x.trim()), ne = f.filter(Boolean); if (!ne.length) continue;
    if (!emissao) for (const x of ne) { const m = /^Emissão: (\d\d\/\d\d\/\d{4} \d\d:\d\d)/.exec(x); if (m) emissao = m[1]; }
    const mc = /^Consultor de Vendas:\s*(\d+)\s*-\s*(.*)$/.exec(ne[0]); if (mc) { cons = [Number(mc[1]), mc[2].trim()]; cur = null; continue; }
    if (cons && /^\d{3,6}$/.test(f[0]) && ne.length >= 2 && !ne[1].startsWith("CPF")) {
      const cod = Number(f[0]); cur = mapa.get(cod);
      if (!cur) { const ult = ne[ne.length - 1]; cur = { cod: cod, razao: f[2] || "", fantasia: f[10] || "", email: f[11] || "", cadastro: /^\d\d\/\d\d\/\d{4}/.test(ult) ? ult : "", cons: [] }; mapa.set(cod, cur); }
      if (!cur.cons.some((c) => c[0] === cons[0])) cur.cons.push(cons); continue; }
    if (!cur) continue;
    for (const [lab, k] of ROT) { if (k in cur) continue; const i = f.indexOf(lab); if (i < 0) continue;
      let v = ""; for (const y of f.slice(i + 1)) { if (y.endsWith(":") && y !== lab) break; if (y) { v = y; break; } } cur[k] = v; }
  }
  return { emissao: emissao, clientes: [...mapa.values()] };
}
async function importarClientes() {
  const m = cli.imp; if (!m || ocupado) return; ocupado = true;
  const lote = String(Date.now()), todos = m.clientes, passo = 400;
  try {
    for (let i = 0; i < todos.length; i += passo) {
      const fim = i + passo >= todos.length; cli.imp.msg = "Enviando " + fmt(Math.min(i + passo, todos.length)) + " de " + fmt(todos.length) + "…"; render();
      const r = await chamar("api_importar_clientes", { p_token: token, p_dados: { lote: lote, clientes: todos.slice(i, i + passo), fim: fim, total: todos.length, arquivo: m.arquivo, emissao: m.emissao } });
      if (!r || r.erro) throw new Error(r && r.erro || "erro");
    }
    cli.imp = null; toast(fmt(todos.length) + " clientes importados."); ocupado = false; await carregarCli(); reps = await chamar("api_representantes", { p_token: token }); render(); return;
  } catch (e) { cli.imp.msg = "A importação parou no meio e nada foi apagado. Tente de novo."; cli.imp.erro = true; }
  ocupado = false; render();
}
function telaEntrar(erro) {
  montado = false;
  const cod = el("input", { id: "cod", placeholder: "código de gerênte", autocomplete: "off", autocapitalize: "none", autocorrect: "off", spellcheck: "false", enterkeyhint: "go" });
  const ir = () => { const v = cod.value.trim(); if (!v) return; token = v; try { localStorage.setItem("pe-gerente", v); } catch (e) {} carregar(); };
  cod.addEventListener("keydown", (e) => { if (e.key === "Enter") ir(); });
  $("#app").replaceChildren(el("div", { class: "entrar" },
    el("div", { class: "marca" }, "Pollo Decor · Gerência"), el("h1", null, "Reservas"),
    erro ? el("p", { style: "color:var(--ink-2);font-size:13.5px;margin:0" }, erro) : null,
    cod, el("button", { type: "button", onclick: ir }, "Entrar")));
}

function montarTela() {
  montado = true;
  const bx = el("input", { type: "search", id: "busca", placeholder: "Buscar representante, produto ou cor", autocomplete: "off",
    autocapitalize: "none", autocorrect: "off", spellcheck: "false", enterkeyhint: "search", value: busca });
  bx.addEventListener("input", () => { busca = bx.value; render(); });
  const dt = el("input", { type: "date", id: "dia", value: (reservas && reservas.dia) || "" });
  dt.addEventListener("change", () => { dia = dt.value || null; carregar(); });
  $("#app").replaceChildren(
    el("div", { class: "topo" },
      el("div", { class: "cabeca" },
        el("div", null, el("div", { class: "marca" }, "Pollo Decor · Gerência"), el("h1", { id: "tituloTela" }, "Reservas do dia")),
        el("div", { class: "diaTxt", id: "diaTxt" })),
      el("div", { class: "abas", id: "abas" })),
    el("div", { class: "placar", id: "placar" }),
    el("div", { class: "ferramentas", id: "ferramentas" }, bx, dt,

    const A = porPessoa[a].reduce((s, l) => s + l.qtd, 0), B = porPessoa[b].reduce((s, l) => s + l.qtd, 0);
    return B - A || a.localeCompare(b);
  }).map((nome) => {
    const rr = porPessoa[nome].sort((a, b) => new Date(a.quando) - new Date(b.quando));
    const tot = rr.reduce((s, l) => s + l.qtd, 0), aguarda = rr.filter((l) => !l.virou_pedido).reduce((s, l) => s + l.qtd, 0);
    return el("section", { class: "pessoa" },
      el("div", { class: "pessoaTopo" },
        el("div", null, el("div", { class: "pessoaNome" }, nome),
          el("div", { class: "pessoaSub" }, (rr[0].regiao || "sem região") + " · " + rr.length + (rr.length === 1 ? " reserva" : " reservas") + " · desde " + hora(rr[0].quando))),
        el("div", { class: "pessoaNum" }, fmt(tot) + " pç", el("br"),
          aguarda ? el("span", { class: "pend" }, fmt(aguarda) + " aguardando") : el("span", { style: "color:var(--ok)" }, "tudo em pedido"))),
      ...rr.map(resLinha));
  });
  corpo.replaceChildren(...blocos);
}
function resLinha(l) {
  const marcar = async () => {
    if (ocupado) return; ocupado = true;
    try { reservas = await chamar("api_virou_pedido", { p_token: token, p_reserva: l.reserva_id, p_valor: !l.virou_pedido });
      toast(l.virou_pedido ? "Voltou para aguardando" : "Marcado como pedido"); }
    catch (e) { toast("Não consegui gravar agora."); }
    ocupado = false; render();
  };
  return el("div", { class: "res" + (l.virou_pedido ? " feito" : "") },
    el("div", null,
      el("div", { class: "resNome" }, titulo(l.produto)),
      el("div", { class: "resSub" }, titulo(l.cor), el("span", { class: "etq " + (l.em_linha ? "linha" : "fora") }, l.em_linha ? "Em linha" : "Fora de linha"),
        l.sem_luminaria ? el("span", { class: "etq lum" }, "Sem luminária") : null,
        el("span", null, hora(l.quando)))),
    el("div", { class: "direita" },
      el("div", { class: "qtd" }, el("b", null, fmt(l.qtd)), el("small", null, "pç")),
      el("button", { class: "bt" + (l.virou_pedido ? " ok" : " forte"), type: "button", onclick: marcar }, l.virou_pedido ? "Pedido ✓" : "Marcar pedido")));
}
function renderReps() {
  $("#chips").replaceChildren();
  const termos = semAcento(busca).trim().split(/\s+/).filter(Boolean);
  const lista = (reps || []).filter((r) => r.papel === "representante")
    .filter((r) => !termos.length || termos.every((t) => semAcento(r.nome + " " + (r.regiao || "")).indexOf(t) >= 0))
    .sort((a, b) => (b.ativo - a.ativo) || String(a.nome).localeCompare(String(b.nome)));
  const nome = el("input", { id: "novoNome", placeholder: "Nome do representante", autocomplete: "off" });
  const regiao = el("input", { id: "novaRegiao", placeholder: "Região", autocomplete: "off" });
  const codigo = el("input", { id: "novoCodigo", placeholder: "Código no ERP", autocomplete: "off", inputmode: "numeric", style: "max-width:150px" });
  const cadastrar = async () => {
    const n = nome.value.trim(); if (!n || ocupado) return; ocupado = true;
    try { reps = await chamar("api_salvar_representante", { p_token: token, p_id: null, p_nome: n, p_regiao: regiao.value.trim(), p_ativo: true, p_codigo: Number(codigo.value.replace(/\D/g, "")) || null, p_extras: "" }); toast(n + " cadastrado. Copie o link dele."); }
    catch (e) { toast("Não consegui cadastrar agora."); }
    ocupado = false; render();
  };
  const blocos = lista.length ? lista.map((r) => {
    const link = LINK_APP + "#t=" + r.token;
    const alternar = async () => {
      if (ocupado) return; ocupado = true;
      try { reps = await chamar("api_salvar_representante", { p_token: token, p_id: r.id, p_nome: r.nome, p_regiao: r.regiao, p_ativo: !r.ativo });
        toast(r.ativo ? r.nome + " bloqueado" : r.nome + " liberado"); }
      catch (e) { toast("Não consegui gravar agora."); }
      ocupado = false; render();
    };
    const copiar = () => { try { navigator.clipboard.writeText(link); toast("Link de " + r.nome + " copiado"); } catch (e) { toast("Copie o link na mão."); } };
    const iCod = el("input", { id: "cod" + r.id, inputmode: "numeric", autocomplete: "off", value: r.codigo || "", placeholder: "sem código" });
    const iExt = el("input", { id: "ext" + r.id, inputmode: "numeric", autocomplete: "off", value: (r.codigos_extra || []).join(", "), placeholder: "nenhum" });
    const gravarAcesso = async () => {
      if (ocupado) return; ocupado = true;
      try { reps = await chamar("api_salvar_representante", { p_token: token, p_id: r.id, p_nome: r.nome, p_regiao: r.regiao, p_ativo: r.ativo,
          p_codigo: Number(iCod.value.replace(/\D/g, "")) || 0, p_extras: iExt.value });
        toast("Acesso de " + r.nome + " gravado"); }
      catch (e) { toast("Não consegui gravar agora."); }
      ocupado = false; render();
    };
    const acesso = el("div", { class: "acessoRep" },
      el("div", { class: "campo" }, el("label", { for: "cod" + r.id }, "Código no ERP"), iCod),
      el("div", { class: "campo" }, el("label", { for: "ext" + r.id }, "Também vê os códigos"), iExt),
      el("button", { class: "bt", type: "button", onclick: gravarAcesso }, "Gravar acesso"));
    return el("div", { class: "rep" + (r.ativo ? "" : " bloq") },
      el("div", null, el("div", { class: "resNome" }, r.nome),
        el("div", { class: "resSub" }, r.regiao || "sem região",
          el("span", null, r.codigo ? "cód. " + r.codigo + " · " + fmt(r.clientes) + (r.clientes === 1 ? " cliente" : " clientes") + (r.clientes_extra ? " + " + fmt(r.clientes_extra) + " de outros" : "") : "sem código: não vê clientes"),
          el("span", { class: "etq " + (r.ativo ? "linha" : "fora") }, r.ativo ? "Ativo" : "Bloqueado"),
          el("span", null, r.ultimo_acesso ? "entrou " + new Date(r.ultimo_acesso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "nunca entrou"))),
      el("div", { class: "direita" }, el("button", { class: "bt", type: "button", onclick: alternar }, r.ativo ? "Bloquear" : "Liberar")),
      el("div", { class: "repLink" }, el("button", { class: "bt", type: "button", onclick: copiar }, "Copiar link pessoal"), el("code", null, link)),
      acesso);
  }) : [el("div", { class: "vazio" }, "Nenhum representante cadastrado ainda.")];
  $("#corpo").replaceChildren(
    el("div", { class: "cad" }, nome, regiao, codigo, el("button", { class: "bt forte", type: "button", onclick: cadastrar }, "Cadastrar")),
    el("div", { class: "nota" }, "O código é o do consultor no ERP: é ele que liga o representante aos clientes dele. Em \"Também vê os códigos\" você libera os clientes de outros representantes, separando os códigos por vírgula."),
    ...blocos);
}

if (token) carregar(); else telaEntrar();
document.addEventListener("visibilitychange", () => { if (!document.hidden && token && montado && !ocupado && !(aba === "cli" && (cli.aberto || cli.imp)) && aba !== "reps") carregar(); });
setInterval(() => { if (!document.hidden && token && montado && !ocupado && !/^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement || {}).tagName || "") && !(aba === "cli" && (cli.aberto || cli.imp)) && aba !== "reps") carregar(); }, 90000);
</script>
