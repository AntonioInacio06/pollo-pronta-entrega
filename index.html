<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1F2523">
<title>Pronta Entrega · Pollo Decor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#E9EBE6; --muted:#EEF0EC;
  --ink:#1F2523; --ink-2:#56605B; --ink-3:#7B847F; --line:#D6D9D2; --line-2:#E4E6E1;
  --accent:#96582F; --accent-ink:#FFF; --accent-soft:#F1E6DD;
  --ok:#2A7148; --ok-bg:#E1F0E6; --warn:#8A5E0F; --warn-bg:#F6ECD4; --crit:#A3372F;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#131716; --surface:#1B201F; --surface-2:#242A28; --muted:#1F2523;
  --ink:#E6E9E5; --ink-2:#A6AEAA; --ink-3:#838C88; --line:#343B38; --line-2:#2A302E;
  --accent:#D38D5C; --accent-ink:#1B120D; --accent-soft:#3A2A20;
  --ok:#74C495; --ok-bg:#1C3326; --warn:#E2B55E; --warn-bg:#3A2F16; --crit:#EA8F85;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topo{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.marca{font:700 10.5px/1 var(--f-disp);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font:700 22px/1.1 var(--f-disp);margin:4px 0 2px}
.sub{font-size:12.5px;color:var(--ink-2)}
.busca-linha{display:flex;gap:8px;margin-top:10px}
input[type=search]{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--muted);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 90px);display:grid;gap:10px;max-width:760px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.card h2{font:600 16px/1.25 var(--f-body);margin:0}
.cor{font-size:13px;color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 10.5px/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px}
.tag.linha{background:var(--ok-bg);color:var(--ok)}
.tag.fora{background:var(--muted);color:var(--ink-3);border:1px solid var(--line)}
.tag.lum{background:var(--warn-bg);color:var(--warn)}
.linha-qtd{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line-2);padding-top:10px}
.disp{font:500 13px var(--f-body);color:var(--ink-2)}
.disp b{font:600 20px/1 var(--f-mono);color:var(--ink);margin-right:4px}
.disp.zero b{color:var(--crit)}
.contador{display:flex;align-items:center;gap:8px}
.contador button{width:40px;height:40px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;font:600 20px/1 var(--f-mono);cursor:pointer}
.contador button:disabled{opacity:.35}
.contador .n{min-width:34px;text-align:center;font:600 18px var(--f-mono)}
.reservado{background:var(--accent-soft);border-color:var(--accent)}
.minha{font-size:12.5px;color:var(--accent);font-weight:600}
.vazio{padding:40px 16px;text-align:center;color:var(--ink-3)}
.rodape{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}
.rodape b{font-family:var(--f-mono)}
.atualizado{display:flex;align-items:center;gap:8px;margin:0;padding:9px 16px;background:var(--ok-bg);color:var(--ok);font:600 13px var(--f-body);border-bottom:1px solid var(--line-2)}
.atualizado.velho{background:var(--warn-bg);color:var(--warn)}
.atualizado .ponto{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.atualizado small{font-weight:400;color:var(--ink-2)}
.aviso{margin:12px 16px 0;padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--ink);font-size:13px;border-left:3px solid var(--warn)}
.erro{background:#F6E0DC;border-left-color:var(--crit)}
.entrar{max-width:420px;margin:40px auto;padding:0 16px;display:grid;gap:12px}
.entrar input{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.entrar button{padding:12px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:600 16px var(--f-disp);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:9;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL = "https://qatazfwvckitolhqsqtl.supabase.co";
const SUPA_KEY = "sb_publishable_Mq2CWYw_E4T13_rIYgH83Q_678o_prh";
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
const $ = (s, r = document) => r.querySelector(s);
const el = (t, a, ...k) => { const e = document.createElement(t); if (a) for (const [n, v] of Object.entries(a)) { if (v == null || v === false) continue; if (n === "class") e.className = v; else if (n.startsWith("on")) e.addEventListener(n.slice(2), v); else e.setAttribute(n, v === true ? "" : v); } for (const c of k.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); } return e; };
const fmt = (n) => (Number(n) || 0).toLocaleString("pt-BR");
const titulo = (s) => String(s || "").toLowerCase().replace(/(^|[\s\/(\-])([a-zà-ú])/g, (m, a, b) => a + b.toUpperCase()).replace(/\bLc\b/g, "LC").replace(/\bTv\b/g, "TV");

let token = null, dados = null, filtro = "todos", busca = "", ocupado = false;
try { token = new URLSearchParams(location.hash.slice(1)).get("t") || localStorage.getItem("pe-token"); } catch (e) {}
if (location.hash.includes("t=")) { try { localStorage.setItem("pe-token", token); } catch (e) {} history.replaceState(null, "", location.pathname); }

function toast(t) { const d = el("div", { class: "toast" }, t); document.body.append(d); setTimeout(() => d.remove(), 2600); }
async function chamar(fn, args) { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; }

async function carregar() {
  try { dados = await chamar("api_estoque", { p_token: token }); }
  catch (e) { dados = { erro: "rede", detalhe: e.message }; }
  desenhar();
}
function entrar() {
  $("#app").replaceChildren(el("div", { class: "entrar" },
    el("div", { class: "marca" }, "Pollo Decor"),
    el("h1", null, "Pronta entrega"),
    el("p", { class: "sub" }, "Use o link que a fábrica mandou para você. Se preferir, cole aqui o seu código de acesso."),
    el("input", { id: "cod", placeholder: "código de acesso", autocomplete: "off", autocapitalize: "off" }),
    el("button", { onclick: () => { const v = $("#cod").value.trim(); if (!v) return; token = v; try { localStorage.setItem("pe-token", v); } catch (e) {} carregar(); } }, "Entrar")));
}
function desenhar() {
  if (!token) return entrar();
  const app = $("#app");
  if (!dados || dados.erro) {
    const msg = dados && dados.erro === "acesso" ? "Este código de acesso não vale mais. Fale com a fábrica."
      : dados && dados.erro === "sem_publicacao" ? "A fábrica ainda não publicou a pronta entrega de hoje."
      : "Sem conexão agora. Tente de novo em alguns segundos.";
    app.replaceChildren(el("div", { class: "topo" }, el("div", { class: "marca" }, "Pollo Decor"), el("h1", null, "Pronta entrega")),
      el("div", { class: "aviso erro" }, msg),
      el("div", { class: "vazio" }, el("button", { class: "chip", onclick: carregar }, "Tentar de novo"),
        dados && dados.erro === "acesso" ? el("button", { class: "chip", style: "margin-left:8px", onclick: () => { try { localStorage.removeItem("pe-token"); } catch (e) {} token = null; desenhar(); } }, "Usar outro código") : null));
    return;
  }
  const p = dados.publicacao, itens = dados.itens || [];
  const dt = new Date(p.em);
  const quando = dt.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const diasAtras = Math.floor((Date.now() - dt) / 86400000);
  const quandoTexto = (diasAtras <= 0 ? "hoje às " + dt.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
    : diasAtras === 1 ? "ontem às " + dt.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
    : "há " + diasAtras + " dias (" + quando + ")");
  const lista = itens.filter((i) => (filtro === "todos" || (filtro === "linha" ? i.em_linha : filtro === "fora" ? !i.em_linha : filtro === "minhas" ? i.minha_reserva > 0 : true))
    && (!busca || (titulo(i.produto) + " " + i.cor).toLowerCase().includes(busca.toLowerCase())));
  const totalDisp = itens.reduce((a, i) => a + i.disponivel, 0), minhas = itens.reduce((a, i) => a + i.minha_reserva, 0);

  app.replaceChildren(
    el("div", { class: "topo" },
      el("div", { class: "marca" }, "Pollo Decor"),
      el("h1", null, "Pronta entrega"),
      el("div", { class: "sub" }, dados.representante.nome + (dados.representante.regiao ? " · " + dados.representante.regiao : "")),
      el("div", { class: "busca-linha" },
        el("input", { type: "search", placeholder: "Buscar produto ou cor", value: busca, oninput: (e) => { busca = e.target.value; desenhar(); $("input[type=search]").focus(); } }))),
    el("div", { class: "atualizado" + (diasAtras >= 1 ? " velho" : "") },
      el("span", { class: "ponto" }), "Estoque atualizado " + quandoTexto,
      el("small", null, diasAtras >= 1 ? "· confirme com a fábrica antes de prometer prazo" : "· pela fábrica")),
    el("div", { class: "chips" },
      ...[["todos", "Tudo"], ["linha", "Em linha"], ["fora", "Fora de linha"], ["minhas", "Minhas reservas"]].map(([v, t]) =>
        el("button", { class: "chip", "aria-pressed": String(filtro === v), onclick: () => { filtro = v; desenhar(); } }, t))),
    p.observacao ? el("div", { class: "aviso" }, p.observacao) : null,
    el("main", null, lista.length ? lista.map(cartao) : el("div", { class: "vazio" }, "Nada encontrado.")),
    el("div", { class: "rodape" },
      el("span", null, "Disponível: ", el("b", null, fmt(totalDisp)), " pç"),
      el("span", null, minhas ? ["Reservei hoje: ", el("b", null, fmt(minhas)), " pç · preço sob consulta"] : "Preço sob consulta")));
}
function cartao(i) {
  const disp = i.disponivel, meu = i.minha_reserva;
  const mudar = async (d) => {
    if (ocupado) return; ocupado = true;
    const novo = Math.max(0, meu + d);
    try { const r = await chamar("api_reservar", { p_token: token, p_item: i.id, p_qtd: novo });
      if (r && r.erro === "indisponivel") toast("Outro representante acabou de reservar. Sobraram " + fmt(r.livre) + ".");
      else if (r && r.erro) toast("Não consegui reservar agora.");
      else { dados = r; toast(novo ? "Reservado: " + fmt(novo) + " pç" : "Reserva cancelada"); }
    } catch (e) { toast("Sem conexão. Tente de novo."); }
    ocupado = false; desenhar();
  };
  return el("div", { class: "card" + (meu ? " reservado" : "") },
    el("h2", null, titulo(i.produto)),
    el("div", { class: "cor" }, titulo(i.cor)),
    el("div", { class: "tags" },
      el("span", { class: "tag " + (i.em_linha ? "linha" : "fora") }, i.em_linha ? "Em linha" : "Fora de linha"),
      i.sem_luminaria ? el("span", { class: "tag lum" }, "Sem luminária") : null,
      i.observacao && !i.sem_luminaria ? el("span", { class: "tag lum" }, i.observacao) : null),
    el("div", { class: "linha-qtd" },
      el("span", { class: "disp" + (disp ? "" : " zero") }, el("b", null, fmt(disp)), disp === 1 ? "disponível" : "disponíveis"),
      el("div", { class: "contador" },
        el("button", { onclick: () => mudar(-1), disabled: !meu, "aria-label": "Tirar uma" }, "−"),
        el("span", { class: "n" }, fmt(meu)),
        el("button", { onclick: () => mudar(1), disabled: disp <= 0, "aria-label": "Reservar uma" }, "+"))),
    meu ? el("div", { class: "minha" }, "Reservado por você hoje. Se não virar pedido até o fim do dia, volta para o estoque.") : null);
}
if (token) carregar(); else entrar();
document.addEventListener("visibilitychange", () => { if (!document.hidden && token) carregar(); });
setInterval(() => { if (!document.hidden && token && !ocupado) carregar(); }, 120000);
</script>
</body>
</html>
